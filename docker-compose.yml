services:
  # ---------- Source OLTP database ----------
  postgres-oltp:
    image: postgres:16
    container_name: postgres-oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Airflow metadata database (separate from source) ----------
  postgres-airflow:
    image: postgres:16
    container_name: postgres-airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- One-time init: create metadata tables + admin user ----------
  airflow-init:
    build: ./docker/airflow
    container_name: airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      POSTGRES_HOST: postgres-oltp      # so ingestion tasks reach the source DB by service name
    env_file:
      - .env
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./sql:/opt/airflow/sql
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname admin --lastname user --role Admin --email admin@example.com || true

  # ---------- Web UI (localhost:8080) ----------
  airflow-webserver:
    build: ./docker/airflow
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    env_file:
      - .env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver

  # ---------- Scheduler (runs the DAGs + tasks with LocalExecutor) ----------
  airflow-scheduler:
    build: ./docker/airflow
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    env_file:
      - .env
    volumes: *airflow-volumes
    command: scheduler

volumes:
  pgdata:
  airflow_pgdata:
  airflow_logs:
